name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt pytest
      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q tests
